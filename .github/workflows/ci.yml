name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest -q

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: rag-document-chat:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts, serves health checks and runs as non-root
        run: |
          # Dummy values: the container only needs valid-looking configuration to start.
          docker run -d --name rag \
            -e APP_ENV=test \
            -e SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_ANON_KEY=anon-test \
            -e SUPABASE_SERVICE_KEY=service-test \
            -e ANTHROPIC_API_KEY=anthropic-test \
            -e VOYAGE_API_KEY=voyage-test \
            -e PORT=8123 -p 8123:8123 rag-document-chat:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8123/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8123/healthz
          test "$(docker exec rag id -u)" != "0"
          docker exec rag id
          docker logs rag
          docker rm -f rag
